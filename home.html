<!DOCTYPE html>
<html lang="es">

<head>

    <title>Home | Futness</title>
    <link rel="stylesheet" href="/Styles/global.css" />

<body>

    </main>

        <a href="#">Hacer una receta</a>
        <a href="#">Ir a un restaurante</a>

        <form method="dialog">
